services:
  verticality_workers:
    build: .
    container_name: nms_verticality_workers
    restart: always
    environment:
      - TZ=Asia/Jakarta
      - BROKER_HOST=emqx.nayakanms.com
      - BROKER_PORT=1884
      - MQTT_USER=nyk_ws
      - MQTT_PASS=ws
      - INTERVAL_SEC=5
      - HEARTBEAT_SEC=60
    # Jika ingin me-mount devices.json agar bisa diupdate tanpa rebuild image:
    volumes:
      - ./devices.json:/app/devices.json:ro

  mitratel_monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: nms_mitratel_monitor_standalone
    restart: always
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
      - MITRATEL_MQTT_BROKER=${MITRATEL_MQTT_BROKER:-emqx.nayakanms.com}
      - MITRATEL_MQTT_PORT=${MITRATEL_MQTT_PORT:-1884}
      - MITRATEL_MQTT_USER=${MITRATEL_MQTT_USER:-dmtver_jabo}
      - MITRATEL_MQTT_PASSWORD=${MITRATEL_MQTT_PASSWORD:-jabo123}
      - MITRATEL_LISTEN_WINDOW_SECONDS=${MITRATEL_LISTEN_WINDOW_SECONDS:-300}
      - GSHEET_WEBHOOK_URL=${GSHEET_WEBHOOK_URL:-}
      - EXCEL_OUTPUT=/app/reports/monitoring_mitratel_hourly.xlsx
    volumes:
      - .:/app
      - ./reports:/app/reports
